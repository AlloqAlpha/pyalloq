name: Publish to PyPI

on:
  push:
    tags:
      - "v*"  # Triggers only when you push a tag like 'v0.1.0'

jobs:
  pypi-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest

    # This environment matches what you typed in PyPI
    environment:
      name: pypi
      url: https://pypi.org/p/pyalloq

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        run: uv publish
