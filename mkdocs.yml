site_name: PyAlloq
site_description: A modern Python SDK for quantitative portfolio optimization.
site_author: Siddeshkanth
site_url: https://pyalloq.alloq-alpha.com
repo_name: pyalloq
repo_url: https://github.com/AlloqAlpha/pyalloq
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/AlloqAlpha/pyalloq
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/pyalloq/

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - src
            - src/pyalloq-core/src
            - src/pyalloq-backtest/src
            - src/pyalloq-data-connector/src
            - src/pyalloq-features/src
          options:
            docstring_style: google
            show_source: true
            show_signature_annotations: true
            show_root_heading: true
            show_root_full_path: false
            members_order: source
            separate_signature: true
            merge_init_into_class: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.arithmatex:
      generic: true
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
      title: On this page

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Getting Started:
      - getting-started/installation.md
      - getting-started/quickstart.md
  - Concepts:
      - concepts/building-blocks.md
      - concepts/market-data.md
      - concepts/swapping-components.md
  - User Guide:
      - user-guide/data-connectors.md
      - user-guide/return-estimators.md
      - user-guide/covariance-estimators.md
      - user-guide/allocators.md
      - user-guide/strategy-pipeline.md
      - user-guide/backtesting.md
      - user-guide/feature-engineering.md
  - Mathematics:
      - mathematics/portfolio-theory.md
      - mathematics/estimators.md
      - mathematics/graph-allocators.md
  - References:
      - references/papers.md
  - API Reference:
      - api/core.md
      - api/optimizers.md
      - api/estimators.md
      - api/backtest.md
      - api/data-connector.md
      - api/features.md
