[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[project]
name = "pyalloq"
version = "0.1.18"
description = "A modern Python SDK for quant portfolio optimization."
readme = "README.md"
authors = [
    { name = "Siddeshkanth", email = "pyalloq-info@alloq-alpha.com" }
]
requires-python = ">=3.11"

classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Financial and Insurance Industry",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.11",
  "cvxopt>=1.3; platform_system != 'Windows'",
  "cvxpy>=1.3",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "seaborn>=0.13",
  "pyalloq-core",
  "pyalloq-data-connector",
  "pyalloq-backtest",
  "pyalloq-features",
  "pyalloq-simulation"
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.12.0",
    "hypothesis>=6.100.0",
    "ruff>=0.5.0",
    "pre-commit>=3.7.0",
    "mypy>=1.11.0",
    "pandas-stubs>=2.0.0",
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
    "twine>=5",
    "build>=1",
    "types-requests>=2",
    "types-setuptools>=75",
]

[project.optional-dependencies]
dl = ["torch>=2.0", "timesfm==3.0.1"]
rl = ["stable-baselines3>=2.0", "gymnasium>=0.29"]
all-ml = ["pyalloq[torch,rl]"]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "pytest-mock>=3.12",
  "hypothesis>=6.100",
  "ruff>=0.6",
  "mypy>=1.11",
  "twine>=5",
  "build>=1",
  "types-requests>=2",
  "types-setuptools>=75",
]

[project.urls]
Homepage = "https://github.com/your-org/qpo"
Repository = "https://github.com/your-org/qpo"
Issues = "https://github.com/your-org/qpo/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
files = ["src"]
mypy_path = [
  "src",
  "src/pyalloq-core/src",
  "src/pyalloq-data-connector/src",
  "src/pyalloq-features/src",
  "src/pyalloq-backtest/src",
  "src/pyalloq-simulation/src"
]
explicit_package_bases = true
namespace_packages = true

[[tool.mypy.overrides]]
module = [
    "torch.*",
    "scipy.*",
    "cvxpy.*",
    "sklearn.*",
    "yfinance.*",
    "talib.*",
    "timesfm3.*"
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "tests.*",
]
ignore_errors = true

[tool.uv.sources]
pyalloq-core = { workspace = true }
pyalloq-data-connector = { workspace = true }
pyalloq-features = { workspace = true }
pyalloq-backtest = { workspace = true }
pyalloq-simulation = {workspace = true }


[tool.uv.workspace]
members = [
  "src/pyalloq-core",
  "src/pyalloq-backtest",
  "src/pyalloq-data-connector",
  "src/pyalloq-features",
  "src/pyalloq-simulation"
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = [
  "src",
  "src/pyalloq-core/src",
  "src/pyalloq-backtest/src",
  "src/pyalloq-data-connector/src",
  "src/pyalloq-features/src",
  "src/pyalloq-simulation/src"
]
addopts = "-v --strict-markers -ra"
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
  "dl: deep learning tests requiring torch/timesfm",
  "rl: reinforcement learning tests requiring gymnasium/sb3",
  "integration: end-to-end integration workflows",
  "network: tests that require network access",
]
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::UserWarning",
]

[tool.coverage.run]
source = [
  "pyalloq",
  "pyalloq_core",
  "pyalloq_backtest",
  "pyalloq_features",
  "pyalloq_data_connector",
  "pyalloq_simulation"
]
omit = [
  "*/tests/*",
  "*/site-packages/*",
  "*/rl/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80.0
precision = 2
