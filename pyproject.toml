[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[project]
name = "pyalloq"
version = "0.1.3"
description = "A modern Python SDK for quant portfolio optimization."
readme = "README.md"
authors = [
    { name = "Siddeshkanth", email = "pyalloq-info@alloq-alpha.com" }
]
requires-python = ">=3.11"

classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Financial and Insurance Industry",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.11",
  "cvxopt>=1.3; platform_system != 'Windows'",
  "cvxpy>=1.3",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "seaborn>=0.13",
]

[dependency-groups]
dev = [
    "ruff>=0.5.0",
    "pre-commit>=3.7.0",
    "mypy>=2.3.0",
    "pandas-stubs>=3.0.5.260730",
]

[project.optional-dependencies]
dl = ["torch>=2.0"]
rl = ["stable-baselines3>=2.0", "gymnasium>=0.29"]
all-ml = ["pyalloq[torch,rl]"]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.11",
  "twine>=5",
  "build>=1",
  "types-requests>=2",
  "types-setuptools>=75",
]

[project.urls]
Homepage = "https://github.com/your-org/qpo"
Repository = "https://github.com/your-org/qpo"
Issues = "https://github.com/your-org/qpo/issues"

[tool.setuptools.packages.find]
where = ["src"]

[[tool.mypy.overrides]]
module = [
    "torch.*",
    "scipy.*",
    "cvxpy.*",
    "sklearn.*"
]
ignore_missing_imports = true
